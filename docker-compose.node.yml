# Cross-runtime overlay: layer this on top of docker-compose.yml to hand one of the OrderProcessing
# sample's participants to a Node process, proving a TypeScript participant and a .NET saga exchange
# messages with neither side aware of the other's language.
#
#   docker compose -f docker-compose.yml -f docker-compose.node.yml up -d --build
#
# What changes: order-processing stops registering its own NotificationParticipant
# (Participants__NotificationInProcess=false), and notification-participant — typescript/samples/
# notification-participant, running on Node — binds the same queue in its place. Both halves must
# move together: if the .NET participant stayed registered, both would consume
# vsaga.participant.notification and the broker would round-robin between them, leaving a run that
# looks cross-runtime while roughly half the work still happens in .NET.
#
# Nothing else is reconfigured. OrderSaga, PostShipmentChoreography and InvoiceDeliverySaga keep
# publishing OrderShipped/SendInvoiceEmail exactly as before and keep receiving
# CustomerNotified/InvoiceEmailSent/InvoiceEmailBounced exactly as before — the point being that
# there is nothing to reconfigure. Message types are matched by their C# short type name, which is
# what both runtimes put in x-vsaga-message-type and derive their routing key from.
#
# Unlike the transport overlays, this one keeps the base file's host ports: it swaps a participant
# rather than the transport underneath, so there is no second stack to run side by side.
#
# To watch it work:
#   docker compose logs -f notification-participant     # "notified customer via email/sms" in Node
#   http://localhost:4200                               # NotificationService still a named map node
services:
  order-processing:
    environment:
      Participants__NotificationInProcess: "false"
    depends_on:
      notification-participant:
        condition: service_started

  notification-participant:
    build:
      context: ./typescript
      dockerfile: samples/notification-participant/Dockerfile
    environment:
      RABBITMQ__CONNECTIONSTRING: "amqp://guest:guest@rabbitmq:5672/"
      # Topology registration goes over the Dashboard API rather than straight to Postgres, so this
      # service never needs database credentials or a copy of the schema. Without it, the two nodes
      # this participant owns degrade to "Unresolved" on the Saga Map.
      DASHBOARD__BASEURL: "http://dashboard-api:8080"
      DASHBOARD__APIKEY: "dev-local-only-change-me"
    depends_on:
      rabbitmq:
        condition: service_healthy
      # Topology registration POSTs on startup, so the API has to be accepting requests first.
      dashboard-api:
        condition: service_healthy
